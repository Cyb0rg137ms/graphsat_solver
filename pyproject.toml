[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphsat"
version = "1.1.0"
description = "Verified hybrid SAT solver: continuous relaxation + CDCL with DRUP proof checking"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cyb0rg137ms" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
graphsat = "graphsat.cli:main"

[tool.setuptools.packages.find]
include = ["graphsat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 300

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E741", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
